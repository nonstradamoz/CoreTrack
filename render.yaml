databases:
  - name: coretrack-postgres
    databaseName: coretrack
    user: coretrack
    plan: free

services:
  # 1. Fastify API Backend
  - type: web
    name: coretrack-api
    runtime: node
    plan: free
    buildCommand: npm install -g pnpm@10.5.2 && pnpm install && pnpm --filter @coretrack/api build
    preDeployCommand: pnpm --filter @coretrack/db db:push && pnpm --filter @coretrack/db db:seed
    startCommand: pnpm --filter @coretrack/api start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.18.0
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        fromDatabase:
          name: coretrack-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: '*'

  # 2. Next.js Frontend
  - type: web
    name: coretrack-web
    runtime: node
    plan: free
    buildCommand: npm install -g pnpm@10.5.2 && pnpm install && pnpm --filter @coretrack/web build
    startCommand: pnpm --filter @coretrack/web start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.18.0
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: coretrack-api
          property: host
