version: '3.8'

services:
  # 1. Primary PostgreSQL 16 Database
  postgres:
    image: postgres:16-alpine
    container_name: coretrack-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: coretrack
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d coretrack']
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis 7 Cluster / Cache & Pub/Sub
  redis:
    image: redis:7-alpine
    container_name: coretrack-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. Meilisearch Instant Search Engine
  meilisearch:
    image: getmeili/meilisearch:latest
    container_name: coretrack-meilisearch
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: masterKey123CoreTrackSecure
      MEILI_ENV: development
    ports:
      - '7700:7700'
    volumes:
      - meili_data:/meili_data
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O - http://localhost:7700/health | grep -q "available"']
      interval: 5s
      timeout: 5s
      retries: 5

  # 4. S3-Compatible Object Storage (MinIO)
  minio:
    image: elestio/minio:latest
    container_name: coretrack-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - '9000:9000' # S3 API endpoint
      - '9001:9001' # Web Console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  meili_data:
    driver: local
  minio_data:
    driver: local
